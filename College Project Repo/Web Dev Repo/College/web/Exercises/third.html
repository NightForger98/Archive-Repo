<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href= "mystyle.css"/>
</head>
<body>
    
<div ondblclick="dblclk(this)"  onmouseover="style.backgroundColor='blue'" onmouseout="style.backgroundColor='red'">
</div>
<br> 
<div id ="sed" ondblclick="dblclk(this)"    onmousedown="style.backgroundColor='green'" onmouseup="style.backgroundColor='pink'"></div>
    
 <script>
    function dblclk(x)
    {
        (x.style.backgroundColor== 'red')? x.style.backgroundColor='pink': x.style.backgroundColor='yellow';
    }
 </script>   
</body>
</html>
